# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: carrier-hub
services:  
  app:
    language: dotnet
    project: ./src/CarrierHub.AppHost/CarrierHub.AppHost.csproj
    host: containerapp
hooks:
  # Builds the chat page into OpsAssistant's wwwroot before azd packages the images.
  # wwwroot is gitignored, so without this the image would have no page, or a stale one.
  prepackage:
    windows:
      shell: pwsh
      run: npm --prefix src/CarrierHub.OpsAssistant.Web ci && npm --prefix src/CarrierHub.OpsAssistant.Web run build
    posix:
      shell: sh
      run: npm --prefix src/CarrierHub.OpsAssistant.Web ci && npm --prefix src/CarrierHub.OpsAssistant.Web run build
  # Gives the sweep job's new identity its app role on the Public API, right after provisioning.
  postprovision:
    windows:
      shell: pwsh
      run: ./ops/grant-sweep-role.ps1
    posix:
      shell: pwsh
      run: ./ops/grant-sweep-role.ps1