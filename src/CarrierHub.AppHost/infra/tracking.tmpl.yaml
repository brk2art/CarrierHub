api-version: 2024-02-02-preview
location: {{ .Env.AZURE_LOCATION }}
identity:
  type: UserAssigned
  userAssignedIdentities:
    ? "{{ .Env.AZURE_CONTAINER_REGISTRY_MANAGED_IDENTITY_ID }}"
    : {}
properties:
  environmentId: {{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_ID }}
  configuration:
    activeRevisionsMode: single
    runtime:
      dotnet:
        autoConfigureDataProtection: true
    ingress:
      external: false
      targetPort: {{ targetPortOrDefault 8080 }}
      transport: http
      allowInsecure: true
    registries:
      - server: {{ .Env.AZURE_CONTAINER_REGISTRY_ENDPOINT }}
        identity: {{ .Env.AZURE_CONTAINER_REGISTRY_MANAGED_IDENTITY_ID }}
    secrets:
      - name: connectionstrings--messaging
        value: '{{ .Env.MESSAGING_SERVICEBUSENDPOINT }}'
      - name: connectionstrings--trackingdb
        value: '{{ .Env.POSTGRES_CONNECTIONSTRING }};Database=trackingdb'
  template:
    containers:
      - image: {{ .Image }}
        name: tracking
        env:
          - name: AZURE_CLIENT_ID
            value: {{ .Env.MANAGED_IDENTITY_CLIENT_ID }}
          - name: ASPNETCORE_FORWARDEDHEADERS_ENABLED
            value: "true"
          - name: HTTP_PORTS
            value: '{{ targetPortOrDefault 0 }}'
          - name: MESSAGING_HOST
            value: '{{ .Env.MESSAGING_SERVICEBUSHOSTNAME }}'
          - name: MESSAGING_URI
            value: '{{ .Env.MESSAGING_SERVICEBUSENDPOINT }}'
          - name: OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY
            value: in_memory
          - name: TRACKINGDB_DATABASENAME
            value: trackingdb
          - name: TRACKINGDB_HOST
            value: '{{ .Env.POSTGRES_HOSTNAME }}'
          - name: TRACKINGDB_JDBCCONNECTIONSTRING
            value: jdbc:postgresql://{{ .Env.POSTGRES_HOSTNAME }}/trackingdb?sslmode=require&authenticationPluginClassName=com.azure.identity.extensions.jdbc.postgresql.AzurePostgresqlAuthenticationPlugin
          - name: TRACKINGDB_PORT
            value: "5432"
          - name: TRACKINGDB_URI
            value: postgresql://{{ .Env.POSTGRES_HOSTNAME }}/trackingdb
          - name: ConnectionStrings__messaging
            secretRef: connectionstrings--messaging
          - name: ConnectionStrings__trackingdb
            secretRef: connectionstrings--trackingdb
    scale:
      minReplicas: 1
tags:
  azd-service-name: tracking
  aspire-resource-name: tracking
