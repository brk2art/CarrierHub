api-version: 2024-02-02-preview
location: {{ .Env.AZURE_LOCATION }}
identity:
  type: UserAssigned
  userAssignedIdentities:
    ? "{{ .Env.AZURE_CONTAINER_REGISTRY_MANAGED_IDENTITY_ID }}"
    : {}
properties:
  environmentId: {{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_ID }}
  configuration:
    activeRevisionsMode: single
    runtime:
      dotnet:
        autoConfigureDataProtection: true
    ingress:
      external: false
      targetPort: {{ targetPortOrDefault 8080 }}
      transport: http
      allowInsecure: true
    registries:
      - server: {{ .Env.AZURE_CONTAINER_REGISTRY_ENDPOINT }}
        identity: {{ .Env.AZURE_CONTAINER_REGISTRY_MANAGED_IDENTITY_ID }}
    secrets:
      - name: connectionstrings--assistantdb
        value: '{{ .Env.POSTGRES_CONNECTIONSTRING }};Database=assistantdb'
  template:
    containers:
      - image: {{ .Image }}
        name: opsassistant
        env:
          - name: AZURE_CLIENT_ID
            value: {{ .Env.MANAGED_IDENTITY_CLIENT_ID }}
          - name: ASPNETCORE_FORWARDEDHEADERS_ENABLED
            value: "true"
          - name: ASSISTANTDB_DATABASENAME
            value: assistantdb
          - name: ASSISTANTDB_HOST
            value: '{{ .Env.POSTGRES_HOSTNAME }}'
          - name: ASSISTANTDB_JDBCCONNECTIONSTRING
            value: jdbc:postgresql://{{ .Env.POSTGRES_HOSTNAME }}/assistantdb?sslmode=require&authenticationPluginClassName=com.azure.identity.extensions.jdbc.postgresql.AzurePostgresqlAuthenticationPlugin
          - name: ASSISTANTDB_PORT
            value: "5432"
          - name: ASSISTANTDB_URI
            value: postgresql://{{ .Env.POSTGRES_HOSTNAME }}/assistantdb
          - name: Assistant__Ollama__Endpoint
            value: http://localhost:11434
          - name: Assistant__Ollama__Model
            value: qwen2.5:7b
          - name: Assistant__Provider
            value: AzureOpenAI
          - name: CALENDARMCP_HTTP
            value: http://calendarmcp.internal.{{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN }}
          - name: CALENDARMCP_HTTPS
            value: https://calendarmcp.internal.{{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN }}
          - name: Database__MigrateOnStartup
            value: "true"
          - name: HTTP_PORTS
            value: '{{ targetPortOrDefault 0 }}'
          - name: OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY
            value: in_memory
          - name: PUBLICAPI_HTTP
            value: http://publicapi.{{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN }}
          - name: PUBLICAPI_HTTPS
            value: https://publicapi.{{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN }}
          - name: services__calendarmcp__http__0
            value: http://calendarmcp.internal.{{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN }}
          - name: services__calendarmcp__https__0
            value: https://calendarmcp.internal.{{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN }}
          - name: services__publicapi__http__0
            value: http://publicapi.{{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN }}
          - name: services__publicapi__https__0
            value: https://publicapi.{{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN }}
          - name: ConnectionStrings__assistantdb
            secretRef: connectionstrings--assistantdb
    scale:
      minReplicas: 1
tags:
  azd-service-name: opsassistant
  aspire-resource-name: opsassistant
