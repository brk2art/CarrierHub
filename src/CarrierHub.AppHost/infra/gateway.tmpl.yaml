api-version: 2024-02-02-preview
location: {{ .Env.AZURE_LOCATION }}
identity:
  type: UserAssigned
  userAssignedIdentities:
    ? "{{ .Env.AZURE_CONTAINER_REGISTRY_MANAGED_IDENTITY_ID }}"
    : {}
properties:
  environmentId: {{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_ID }}
  configuration:
    activeRevisionsMode: single
    runtime:
      dotnet:
        autoConfigureDataProtection: true
    ingress:
      external: false
      targetPort: {{ targetPortOrDefault 8080 }}
      transport: http
      allowInsecure: true
    registries:
      - server: {{ .Env.AZURE_CONTAINER_REGISTRY_ENDPOINT }}
        identity: {{ .Env.AZURE_CONTAINER_REGISTRY_MANAGED_IDENTITY_ID }}
    secrets:
      - name: connectionstrings--messaging
        value: '{{ .Env.MESSAGING_SERVICEBUSENDPOINT }}'
      - name: connectionstrings--redis
        value: redis:6379,password={{ securedParameter "redis_password" }}
      - name: parcelgo--webhooksecret
        value: '{{ securedParameter "parcelgo_webhook_secret" }}'
      - name: redis-password
        value: '{{ securedParameter "redis_password" }}'
  template:
    containers:
      - image: {{ .Image }}
        name: gateway
        env:
          - name: AZURE_CLIENT_ID
            value: {{ .Env.MANAGED_IDENTITY_CLIENT_ID }}
          - name: ASPNETCORE_FORWARDEDHEADERS_ENABLED
            value: "true"
          - name: HTTP_PORTS
            value: '{{ targetPortOrDefault 0 }}'
          - name: MESSAGING_HOST
            value: '{{ .Env.MESSAGING_SERVICEBUSHOSTNAME }}'
          - name: MESSAGING_URI
            value: '{{ .Env.MESSAGING_SERVICEBUSENDPOINT }}'
          - name: MOCKCARRIERS_HTTP
            value: http://mockcarriers.internal.{{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN }}
          - name: MOCKCARRIERS_HTTPS
            value: https://mockcarriers.internal.{{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN }}
          - name: OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY
            value: in_memory
          - name: ParcelGo__CallbackBaseUrl
            value: https://gateway.internal.{{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN }}
          - name: REDIS_HOST
            value: redis
          - name: REDIS_PORT
            value: "6379"
          - name: REDIS_URI
            value: redis://:{{ uriEncode (securedParameter "redis_password" )}}@redis:6379
          - name: TRACKING_HTTP
            value: http://tracking.internal.{{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN }}
          - name: TRACKING_HTTPS
            value: https://tracking.internal.{{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN }}
          - name: services__mockcarriers__http__0
            value: http://mockcarriers.internal.{{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN }}
          - name: services__mockcarriers__https__0
            value: https://mockcarriers.internal.{{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN }}
          - name: services__tracking__http__0
            value: http://tracking.internal.{{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN }}
          - name: services__tracking__https__0
            value: https://tracking.internal.{{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN }}
          - name: ConnectionStrings__messaging
            secretRef: connectionstrings--messaging
          - name: ConnectionStrings__redis
            secretRef: connectionstrings--redis
          - name: ParcelGo__WebhookSecret
            secretRef: parcelgo--webhooksecret
          - name: REDIS_PASSWORD
            secretRef: redis-password
    scale:
      minReplicas: 1
tags:
  azd-service-name: gateway
  aspire-resource-name: gateway
